name: Syndicate RSS

on:
  schedule:
    # Every 6 hours; new dailyinsightdesk.com/feed.xml items go to Tumblr, Bluesky, and the public Google Doc.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syndicate new feed items
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node scripts/syndicate.js

      - name: Commit syndication state
        run: |
          git config user.name "edproservice-lang"
          git config user.email "edproservice@gmail.com"
          git add syndication/state.json
          if git diff --staged --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "Update syndication state [skip ci]"
          git push
